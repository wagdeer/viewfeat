feature_type: "superpoint"

superpoint:
  image_width: 512
  image_height: 288
  max_keypoints: 1024
  keypoint_threshold: 0.01
  remove_borders: 4
  input_tensor_names:
    - "image"
  output_tensor_names:
    - "scores"
    - "descriptors"
  onnx_file: "superpoint_v1.onnx"
  engine_file: "superpoint_v1.engine"
  dla_core: -1

superpoint_lightglue:
  num_keypoints: 1024
  filter_threshold: 0.1
  input_tensor_names:
    - "keypoints0"
    - "keypoints1"
    - "descriptors0"
    - "descriptors1"
  output_tensor_names:
    - "scores"
  onnx_file: "superpoint_lightglue.onnx"
  engine_file: "superpoint_lightglue.engine"
  dla_core: -1

aliked:
  image_width: 512
  image_height: 288
  top_k: 1024
  descriptor_dim: 128
  input_tensor_names:
    - "image"
  output_tensor_names:
    - "keypoints"
    - "descriptors"
    - "scores"
  onnx_file: "aliked-n16rot-top1024-512x288.onnx"
  engine_file: "aliked-n16rot-top1024-512x288.engine"
  dla_core: -1

aliked_lightglue:
  descriptor_dim: 128
  filter_threshold: 0.1
  input_tensor_names:
    - "keypoints0"
    - "keypoints1"
    - "descriptors0"
    - "descriptors1"
  output_tensor_names:
    - "scores"
  onnx_file: "aliked_lightglue.onnx"
  engine_file: "aliked_lightglue.engine"
  dla_core: -1

cosplace:
  input_size: 320
  descriptor_dim: 512
  input_tensor_names:
    - "images"
  output_tensor_names:
    - "descriptors"
  onnx_file: "cosplace.onnx"
  engine_file: "cosplace.engine"
  dla_core: -1

eigenplaces:
  input_size: 512
  descriptor_dim: 512
  input_tensor_names:
    - "images"
  output_tensor_names:
    - "descriptors"
  onnx_file: "eigenplaces.onnx"
  engine_file: "eigenplaces.engine"
  dla_core: -1

flexglue:
  input_size: 512
  feature_dim: 256
  feature_width: 64
  feature_height: 64
  max_keypoints: 1024
  filter_threshold: 0.1
  max_distance_px: 3.0
  min_covisibility: 0.0
  descriptor_input_tensor_names:
    - "image"
  descriptor_output_tensor_names:
    - "features"
  matcher_input_tensor_names:
    - "features0"
    - "features1"
    - "kpts0"
    - "kpts1"
    - "image_size0"
    - "image_size1"
    - "filter_threshold"
    - "max_distance_px"
    - "min_covisibility"
  matcher_output_tensor_names:
    - "matches0"
    - "mscores0"
    - "covisibility_score"
  descriptor_engine_file: "flexglue_descriptor.engine"
  matcher_engine_file: "flexglue_matcher.engine"
